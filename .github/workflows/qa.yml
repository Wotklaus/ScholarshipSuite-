name: CI - QA Full Monorepo Pipeline

on:
  push:
    branches:
      - qa

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # Checkout
      # -------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------
      # Node setup
      # -------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # -------------------------
      # Install root deps
      # -------------------------
      - name: Install dependencies
        run: npm install

      # -------------------------
      # Run tests (non-blocking)
      # -------------------------
      - name: Run tests
        run: npm test || echo "No tests configured"

      # -------------------------
      # Docker login
      # -------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # =========================
      # BUILD & PUSH MICROSERVICES
      # =========================

      - name: Build & Push auth-service
        run: |
          docker build -t wotklaus86682/auth-service:qa ./services/auth-service
          docker push wotklaus86682/auth-service:qa

      - name: Build & Push contracts-service
        run: |
          docker build -t wotklaus86682/contracts-service:qa ./services/contracts-service
          docker push wotklaus86682/contracts-service:qa

      - name: Build & Push validation-service
        run: |
          docker build -t wotklaus86682/validation-service:qa ./services/validation-service
          docker push wotklaus86682/validation-service:qa

      - name: Build & Push signature-service
        run: |
          docker build -t wotklaus86682/signature-service:qa ./services/signature-service
          docker push wotklaus86682/signature-service:qa

      - name: Build & Push audit-service
        run: |
          docker build -t wotklaus86682/audit-service:qa ./services/audit-service
          docker push wotklaus86682/audit-service:qa

      - name: Build & Push analytics-service
        run: |
          docker build -t wotklaus86682/analytics-service:qa ./services/analytics-service
          docker push wotklaus86682/analytics-service:qa

      - name: Build & Push event-bus-service
        run: |
          docker build -t wotklaus86682/event-bus-service:qa ./services/event-bus-service
          docker push wotklaus86682/event-bus-service:qa

      - name: Build & Push notification-service
        run: |
          docker build -t wotklaus86682/notification-service:qa ./services/notification-service
          docker push wotklaus86682/notification-service:qa

      - name: Build & Push api-gateway
        run: |
          docker build -t wotklaus86682/api-gateway:qa ./gateway
          docker push wotklaus86682/api-gateway:qa
