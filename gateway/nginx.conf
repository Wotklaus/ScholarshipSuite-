worker_processes  1;

events { worker_connections  1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  keepalive_timeout  65;

  # ✅ Para subir PDFs sin que reviente
  client_max_body_size 20m;

  # ✅ Logs (útil para depurar)
  access_log  /var/log/nginx/access.log;
  error_log   /var/log/nginx/error.log warn;

  # ✅ Upstreams (tus microservicios)
  upstream auth_service {
    server host.docker.internal:3000;
  }

  upstream contracts_service {
    server host.docker.internal:3002;
  }

  upstream validation_service {
    server host.docker.internal:3003;
  }

  server {
    listen 8080;

    # ✅ Headers base (WebSockets / keep-alive)
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ✅ MUY IMPORTANTE: que pase cookies tal cual
    proxy_set_header Cookie $http_cookie;

    # -------------------------
    # AUTH
    # -------------------------
    location /auth/ {
      proxy_pass http://auth_service/;
    }

    # -------------------------
    # CONTRACTS
    # -------------------------
    location /contracts/ {
      proxy_pass http://contracts_service/;
    }

    # -------------------------
    # VALIDATION
    # -------------------------
    location /validation/ {
      proxy_pass http://validation_service/;
    }

    # ✅ Health simple del gateway
    location /health {
      return 200 "gateway ok\n";
    }
  }
}
