worker_processes 1;

events { worker_connections 1024; }

http {
  # logs (útil para debug)
  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log warn;

  # tamaños por si subes PDFs
  client_max_body_size 20m;

  # upstreams (nombres = servicios de docker-compose)
  upstream auth_service       { server auth-service:3000; }
  upstream contracts_service  { server contracts-service:3002; }
  upstream validation_service { server validation-service:3003; }
  upstream signature_service  { server signature-service:3004; }

  server {
    listen 8080;

    # health del gateway
    location = /health {
      default_type application/json;
      return 200 '{"ok":true,"service":"api-gateway"}';
    }

    # --- AUTH ---
    location /auth/ {
      rewrite ^/auth/(.*)$ /$1 break;
      proxy_pass http://auth_service;

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # cookies
      proxy_set_header Cookie $http_cookie;
      proxy_pass_request_headers on;
    }

    # --- CONTRACTS ---
    location /contracts/ {
      rewrite ^/contracts/(.*)$ /$1 break;
      proxy_pass http://contracts_service;

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_set_header Cookie $http_cookie;
      proxy_pass_request_headers on;
    }

    # --- VALIDATION ---
    location /validation/ {
      rewrite ^/validation/(.*)$ /$1 break;
      proxy_pass http://validation_service;

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_set_header Cookie $http_cookie;
      proxy_pass_request_headers on;
    }

    # --- SIGNATURES ---
    location /signatures/ {
      rewrite ^/signatures/(.*)$ /$1 break;
      proxy_pass http://signature_service;

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_set_header Cookie $http_cookie;
      proxy_pass_request_headers on;
    }
  }
}
