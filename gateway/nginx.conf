worker_processes 1;

events {
  worker_connections 1024;
}

http {
  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log warn;

  client_max_body_size 20m;

  # ========================
  # UPSTREAMS
  # ========================
  upstream auth_service {
    server auth-service:3000;
  }

  upstream contracts_service {
    server contracts-service:3002;
  }

  upstream validation_service {
    server validation-service:3003;
  }

  upstream signature_service {
    server signature-service:3004;
  }

  server {
    listen 8080;

    # ========================
    # HEALTH
    # ========================
    location = /health {
      default_type application/json;
      return 200 '{"ok":true,"service":"api-gateway"}';
    }

    # ========================
    # AUTH
    # ========================
    location /auth/ {

      # PREFLIGHT
      if ($request_method = OPTIONS) {
        add_header 'Access-Control-Allow-Origin' 'http://localhost:3001' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
        return 204;
      }

      # CORS NORMAL
      add_header 'Access-Control-Allow-Origin' 'http://localhost:3001' always;
      add_header 'Access-Control-Allow-Credentials' 'true' always;

      proxy_pass http://auth_service;

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Cookie $http_cookie;
    }

    # ========================
    # CONTRACTS
    # ========================
    location /contracts/ {

      if ($request_method = OPTIONS) {
        add_header 'Access-Control-Allow-Origin' 'http://localhost:3001' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
        return 204;
      }

      add_header 'Access-Control-Allow-Origin' 'http://localhost:3001' always;
      add_header 'Access-Control-Allow-Credentials' 'true' always;

      rewrite ^/contracts/(.*)$ /$1 break;
      proxy_pass http://contracts_service;

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Cookie $http_cookie;
    }

    # ========================
    # VALIDATION
    # ========================
    location /validation/ {

      if ($request_method = OPTIONS) {
        add_header 'Access-Control-Allow-Origin' 'http://localhost:3001' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
        return 204;
      }

      add_header 'Access-Control-Allow-Origin' 'http://localhost:3001' always;
      add_header 'Access-Control-Allow-Credentials' 'true' always;

      rewrite ^/validation/(.*)$ /$1 break;
      proxy_pass http://validation_service;

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Cookie $http_cookie;
    }

    # ========================
    # SIGNATURES
    # ========================
    location /signatures/ {

      if ($request_method = OPTIONS) {
        add_header 'Access-Control-Allow-Origin' 'http://localhost:3001' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
        return 204;
      }

      add_header 'Access-Control-Allow-Origin' 'http://localhost:3001' always;
      add_header 'Access-Control-Allow-Credentials' 'true' always;

      rewrite ^/signatures/(.*)$ /$1 break;
      proxy_pass http://signature_service;

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Cookie $http_cookie;
    }
  }
}
